name: Build Mac installer
on:
  push:
    branches: ['arena/d9ae4a19-sales-agent']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build unsigned Mac installers
        shell: bash
        run: |
          set +e
          npm run dist:mac > build-log.txt 2>&1
          result=$?
          cat build-log.txt
          if [ "$result" -ne 0 ]; then
            details=$(tail -c 5000 build-log.txt)
            details="${details//'%'/'%25'}"
            details="${details//$'\n'/'%0A'}"
            details="${details//$'\r'/'%0D'}"
            echo "::error::$details"
          fi
          exit "$result"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Flightdesk-Mac-installers
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30
      - name: Publish installers to a GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "flightdesk-build-${GITHUB_RUN_ID}" dist/*.dmg \
            --target "$GITHUB_SHA" --prerelease \
            --title "Flightdesk Mac preview" \
            --notes "Unsigned, non-notarized preview. Choose arm64 for Apple silicon or x64 for Intel. An OpenAI API key is required. See README for audio routing, consent and limitations."
