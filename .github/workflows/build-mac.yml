name: Build Mac installer
on:
  push:
    branches: ['arena/d9ae4a19-sales-agent']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build unsigned Mac installers
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Flightdesk-Mac-installers
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30
