name: Build Mac installer
on:
  push:
    branches: ['arena/*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build ad-hoc signed Mac installers
        shell: bash
        run: |
          set +e
          npm run dist:mac > build-log.txt 2>&1
          result=$?
          cat build-log.txt
          if [ "$result" -ne 0 ]; then
            details=$(tail -c 5000 build-log.txt)
            details="${details//'%'/'%25'}"
            details="${details//$'\n'/'%0A'}"
            details="${details//$'\r'/'%0D'}"
            echo "::error::$details"
          fi
          exit "$result"
        env:
          # Identity "-" in package.json forces ad-hoc signing with hardened
          # runtime. Without it the app is fully unsigned and Gatekeeper
          # reports it as "damaged" when downloaded from a browser.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify ad-hoc signatures
        shell: bash
        run: |
          set -e
          # Fail the build if the app is not signed; an unsigned app is what
          # triggers the "damaged and can't be opened" Gatekeeper alert.
          find dist -name 'Flightdesk.app' -print -exec codesign --verify --deep --strict {} \;
          find dist -name 'Flightdesk.app' -exec codesign -dv --verbose=4 {} \; 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: Flightdesk-Mac-installers
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30
      - name: Publish installers to a GitHub prerelease
        if: contains(github.event.head_commit.message, '[publish-installer]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "flightdesk-build-${GITHUB_RUN_ID}" dist/*.dmg \
            --target "$GITHUB_SHA" --prerelease \
            --title "Flightdesk Mac preview" \
            --notes "Ad-hoc signed, non-notarized preview (no Apple Developer ID). Choose arm64 for Apple silicon or x64 for Intel. macOS may still block it on first open because the browser marks the download as quarantined — see README 'If macOS says damaged' for the one-time allow steps. An OpenAI API key is required. See README for audio routing, consent and limitations."
